name: MLOps Containerize and Deploy Pipeline

on:
  push:
    branches:
      - deploy-best-model

jobs:
  # STAGE 1: Build & Push (Runs on GitHub Ubuntu)
  build-and-push:
    name: Build Image & Push to ECR
    runs-on: ubuntu-latest  # <-- Runs on fast, clean GitHub servers!

    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 1. Authenticate with AWS first
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Use the official DVC action (Bypasses all pip dependency hell)
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      # 3. Pull Model Artifacts
      - name: Pull Model Artifacts from S3 via DVC
        run: dvc pull models/best_model.joblib models/preprocessor_pipeline.joblib

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: set-tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # STAGE 2: Deploy Container (Runs on your EC2)
  deploy:
    name: Pull Image from ECR & Run App
    needs: build-and-push  
    runs-on: self-hosted   # Stays on your EC2 to deploy the container

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Latest Container Image from ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Docker Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          # Stop and remove previous container instance if active
          docker stop spaceship-fastapi-app || true
          docker rm spaceship-fastapi-app || true

          # Run the container in detached background mode
          docker run -d \
            --name spaceship-fastapi-app \
            --restart always \
            -p 8000:8000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Verify Running Container Status
        run: |
          docker ps -f name=spaceship-fastapi-app