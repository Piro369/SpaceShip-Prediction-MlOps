[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "V1"
version = "0.0.1"
description = "It is an End to End project focusing on MLOps techniques. The project involves prediction of Spaceship passengers whether they are going to another dimension"
authors = [
  { name = "Wajih Ul Hassan" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.5"


[tool.ruff]
line-length = 99
src = ["V1"]
include = ["pyproject.toml", "V1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["V1"]
force-sort-within-sections = true

